info:
  name: forget-password
  type: http
  seq: 7

http:
  method: POST
  url: "{{API}}/auth/forget-password"
  headers:
    - name: Accept
      value: application/json
      disabled: true
  body:
    type: json
    data: |-
      {
        "email": "{{EMAIL}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
