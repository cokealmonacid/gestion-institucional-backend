info:
  name: reset-password-confirm
  type: http
  seq: 10

http:
  method: POST
  url: "{{API}}/auth/reset-password-confirm"
  headers:
    - name: Accept
      value: application/json
      disabled: true
  body:
    type: json
    data: |-
      {
        "email": "{{EMAIL}}",
        "token": "{{RESET_TOKEN}}",
        "password": "{{PASSWORD}}",
        "password_confirmation": "{{PASSWORD}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
