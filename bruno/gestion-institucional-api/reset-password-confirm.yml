info:
  name: reset-password-confirm
  type: http
  seq: 10

http:
  method: POST
  url: "{{API}}/auth/reset-password-confirm"
  headers:
    - name: Accept
      value: application/json
      disabled: true
  body:
    type: json
    data: |-
      {
        "token": "testapi@example.com",
        "password": "12345678",
        "password_confirmation": "12345678"
      }
  auth:
    type: bearer
    token: "{{API}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
