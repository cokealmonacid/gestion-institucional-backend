info:
  name: Edit tags document
  type: http
  seq: 23

http:
  method: PATCH
  url: "{{API}}/institution/document/{{DOCUMENT_ID}}/tags"
  body:
    type: json
    data: |-
      {
        "institution_id": {{INSTITUTION_ID}},
        "tags_id": [
          {{TAG_ID}}
        ]
      }
  auth:
    type: bearer
    token: "{{TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
